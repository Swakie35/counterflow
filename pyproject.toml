[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "counterflow-forecast"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.9.1,<2"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.setuptools.packages.find]
include = ["counterflow*"]
